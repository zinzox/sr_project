<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Commandes — Sarbi Rohek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="client-space.css" />
  <style>
    .orders-container { padding: 20px; }
    .order-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; }
    .stat-card.pending { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .stat-card.completed { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .stat-number { font-size: 2.5em; font-weight: 700; }
    .stat-label { font-size: 0.9em; opacity: 0.9; margin-top: 5px; }
    .orders-list { display: grid; gap: 15px; }
    .order-card { background: white; border-left: 4px solid #667eea; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .order-card.in-progress { border-left-color: #f5576c; }
    .order-card.completed { border-left-color: #00f2fe; }
    .order-header { display: grid; grid-template-columns: 1fr auto; gap: 15px; margin-bottom: 15px; }
    .order-title { font-weight: 600; font-size: 1.1em; }
    .order-status { padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-in-progress { background: #cfe2ff; color: #084298; }
    .status-completed { background: #d1e7dd; color: #0f5132; }
    .status-cancelled { background: #f8d7da; color: #842029; }
    .order-timeline { margin: 15px 0; padding: 15px; background: #f9f9f9; border-radius: 4px; }
    .timeline-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.9em; }
    .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: #667eea; margin-top: 2px; flex-shrink: 0; }
    .order-actions { display: flex; gap: 10px; }
    .order-actions button { padding: 8px 12px; font-size: 0.9em; }
  </style>
</head>
<body>
  <main class="orders-container">
    <header>
      <div style="margin-bottom: 30px;">
        <p class="kicker">Gestion des commandes</p>
        <h1>Mes commandes et paiements</h1>
        <p class="subtitle">Suivi en temps réel de vos commandes et historique de paiements.</p>
      </div>
      <a class="btn ghost" href="client-space.html">← Retour à l'espace client</a>
    </header>

    <!-- Statistiques -->
    <section class="order-stats">
      <div class="stat-card">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Commandes totales</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-number" id="statPending">0</div>
        <div class="stat-label">En attente</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-number" id="statCompleted">0</div>
        <div class="stat-label">Complétées</div>
      </div>
    </section>

    <!-- Liste des commandes -->
    <section class="module-card">
      <h2>Historique des commandes</h2>
      <p id="ordersStatus" class="status">Chargement des commandes...</p>
      <div id="ordersList" class="orders-list"></div>
    </section>

  </main>

  <script>
    const ordersListEl = document.getElementById("ordersList");
    const ordersStatus = document.getElementById("ordersStatus");
    let currentUserEmail = "";

    async function loadCurrentUser() {
      try {
        const response = await fetch("/sarbi_rohek/api/auth/status");
        const data = await response.json();
        if (!data.loggedIn) {
          window.location.href = "/sarbi_rohek/login.html";
          return;
        }
        currentUserEmail = data.email;
        loadOrders();
      } catch (error) {
        console.error("Erreur lors du chargement", error);
      }
    }

    async function loadOrders() {
      // Mock data pour démonstration
      const mockOrders = [
        {
          id: 1,
          providerEmail: "fatma@gmail.com",
          providerName: "Fatma Barouni",
          status: "completed",
          amount: 150,
          date: "2026-03-28",
          description: "Montage vidéo",
          timeline: ["Commandé le 28/03", "Confirmé le 28/03", "Complété le 30/03"]
        },
        {
          id: 2,
          providerEmail: "azizweslati2319@gmail.com",
          providerName: "Dorra Mharouech",
          status: "in-progress",
          amount: 200,
          date: "2026-04-01",
          description: "Développement web",
          timeline: ["Commandé le 01/04", "En cours..."]
        },
        {
          id: 3,
          providerEmail: "test@example.com",
          providerName: "Prestataire Test",
          status: "pending",
          amount: 75,
          date: "2026-04-02",
          description: "Service personnalisé",
          timeline: ["Commandé le 02/04", "En attente de confirmation..."]
        }
      ];

      updateStats(mockOrders);
      ordersListEl.innerHTML = "";
      
      mockOrders.forEach(order => {
        const statusClass = `status-${order.status}`;
        const card = document.createElement("div");
        card.className = `order-card ${order.status}`;
        
        const timeline = order.timeline.map(item => 
          `<div class="timeline-item"><span class="timeline-dot"></span><span>${item}</span></div>`
        ).join("");

        card.innerHTML = `
          <div class="order-header">
            <div>
              <div class="order-title">${order.description}</div>
              <small style="color: #999;">${order.providerName}</small>
            </div>
            <span class="order-status ${statusClass}">${order.status.toUpperCase()}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; font-size: 0.9em;">
            <div><strong>Montant:</strong> ${order.amount} TND</div>
            <div><strong>Date:</strong> ${new Date(order.date).toLocaleDateString()}</div>
            <div><strong>Commande n°:</strong> #${order.id}</div>
          </div>
          <div class="order-timeline">${timeline}</div>
          <div class="order-actions">
            <button class="btn ghost" onclick="viewOrderDetails(${order.id})">Voir détails</button>
            ${order.status === "completed" ? `<button class="btn ghost" onclick="downloadInvoice(${order.id})">Facture</button>` : ""}
            ${order.status === "pending" ? `<button class="btn danger" onclick="cancelOrder(${order.id})">Annuler</button>` : ""}
          </div>
        `;
        ordersListEl.appendChild(card);
      });

      ordersStatus.textContent = "";
    }

    function updateStats(orders) {
      document.getElementById("statTotal").textContent = orders.length;
      document.getElementById("statPending").textContent = orders.filter(o => o.status === "pending").length;
      document.getElementById("statCompleted").textContent = orders.filter(o => o.status === "completed").length;
    }

    function viewOrderDetails(orderId) {
      alert(`Détails de la commande #${orderId} - À implémenter`);
    }

    function downloadInvoice(orderId) {
      alert(`Téléchargement de la facture pour la commande #${orderId}`);
    }

    function cancelOrder(orderId) {
      if (confirm("Êtes-vous sûr de vouloir annuler cette commande ?")) {
        alert("Commande annulée");
      }
    }

    loadCurrentUser();
  </script>
  <script src="chatbot-widget.js"></script>
</body>
</html>
